name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Seule l'URL du worker est injectée : elle n'est pas secrète (visible dans
      # les requêtes réseau de toute façon). Clé Stormglass et URL iCal vivent
      # côté worker Cloudflare (wrangler secret put), plus jamais dans le bundle.
      - name: Inject env
        run: |
          echo "VITE_SIRI_PROXY=${{ secrets.SIRI_PROXY }}" > .env.local
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
